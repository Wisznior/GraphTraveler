services:
  neo4j:
    image: neo4j:5-community
    container_name: graphtraveler-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-graphtraveler123}
      NEO4JLABS_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
    volumes:
      - neo4j_data:/data
      - ./neo4j/init:/var/lib/neo4j/import/init
    networks:
      - graphtraveler-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 60s

  neo4j-init:
    image: neo4j:5-community
    container_name: graphtraveler-neo4j-init
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-graphtraveler123}
    volumes:
      - ./neo4j/init:/init
    networks:
      - graphtraveler-net
    entrypoint: >
      /bin/bash -c "
        echo 'Uruchamiam inicjalizację Neo4j...' &&
        for f in /init/*.cypher; do
          echo \"Wykonuję: \$$f\" &&
          cypher-shell -a bolt://neo4j:7687 -u \$${NEO4J_USER:-neo4j} -p \$${NEO4J_PASSWORD:-graphtraveler123} --file \$$f || true;
        done &&
        echo 'Inicjalizacja zakończona.'
      "
    restart: "no"

  api:
    build: ./backend
    container_name: graphtraveler-api
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-graphtraveler123}
    depends_on:
      neo4j-init:
        condition: service_completed_successfully
    networks:
      - graphtraveler-net
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: graphtraveler-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - graphtraveler-net

volumes:
  neo4j_data:

networks:
  graphtraveler-net:
    driver: bridge