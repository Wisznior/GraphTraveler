<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraphTraveler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --teal:        #0a9396;
        --teal-light:  #e0f4f5;
        --teal-mid:    #94d2bd;
        --navy:        #0d2d3a;
        --amber:       #ee9b00;
        --amber-light: #fff3cd;
        --surface:     #ffffff;
        --bg:          #f4f7f8;
        --border:      #e2eaec;
        --text:        #1a2e35;
        --text-muted:  #5b7b87;
        --text-faint:  #9ab4bc;
        --shadow-sm:   0 1px 3px rgba(13,45,58,.07), 0 1px 2px rgba(13,45,58,.05);
        --shadow-md:   0 4px 16px rgba(13,45,58,.09), 0 1px 4px rgba(13,45,58,.06);
        --shadow-lg:   0 12px 40px rgba(13,45,58,.13), 0 2px 8px rgba(13,45,58,.07);
        --radius:      12px;
        --font:        'DM Sans', sans-serif;
        --mono:        'DM Mono', monospace;
      }
      html { scroll-behavior: smooth; }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      #root { display: flex; flex-direction: column; min-height: 100vh; }
      button { font-family: inherit; }
      ::selection { background: var(--teal); color: #fff; }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: var(--bg); }
      ::-webkit-scrollbar-thumb { background: var(--teal-mid); border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
